name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version from version.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' version.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Extract Changelog
        id: get_changelog
        run: |
          CHANGELOG=$(jq -r --arg v "$VERSION" '.changelog[] | select(.version == $v) | .changes[] | "- " + .' version.json)
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build App (CI Mode)
        env:
          CI: "true"
        run: |
          chmod +x install-jobsmonitor.command
          ./install-jobsmonitor.command

      - name: Zip the App
        run: |
          cd Build
          export COPYFILE_DISABLE=1
          xattr -cr "JobsMonitor.app"
          find "JobsMonitor.app" -name "._*" -delete 2>/dev/null || true
          find "JobsMonitor.app" -name ".DS_Store" -delete 2>/dev/null || true
          zip -q -r -y ../JobsMonitor.zip "JobsMonitor.app"
          cd ..

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag || true
          git tag -d "v${{ env.VERSION }}" 2>/dev/null || true
          gh release create "v${{ env.VERSION }}" JobsMonitor.zip \
            --title "v${{ env.VERSION }}" \
            --notes "${{ env.CHANGELOG }}" \
            --target "$GITHUB_SHA" || gh release upload "v${{ env.VERSION }}" JobsMonitor.zip --clobber

      - name: Calculate SHA256
        id: calc_sha
        run: |
          SHA256=$(shasum -a 256 JobsMonitor.zip | awk '{ print $1 }')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "Computed SHA256: $SHA256"

      - name: Checkout Homebrew Tap
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: arunofhyd/homebrew-jobsmonitor
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-jobsmonitor

      - name: Update Formula
        continue-on-error: true
        run: |
          if [ -d "homebrew-jobsmonitor" ]; then
            cd homebrew-jobsmonitor
            sed -i '' -e "s/version \".*\"/version \"${{ env.VERSION }}\"/" Casks/jobsmonitor.rb
            sed -i '' -e "s/sha256 \".*\"/sha256 \"${{ env.SHA256 }}\"/" Casks/jobsmonitor.rb
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Casks/jobsmonitor.rb
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update jobsmonitor to v${{ env.VERSION }}"
              git push
            fi
          fi
